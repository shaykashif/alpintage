[project]
name = "kalshi-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SK", email = "emeraldonfire101@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "duckdb>=1.5.5",
    "fastembed>=0.8.1",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "websockets>=17.1",
]

[project.scripts]
kalshi-engine = "kalshi_engine:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
